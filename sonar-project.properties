# SonarQube analysis settings, used by the CI workflow.
# Server: self-hosted SonarQube on the AWS tools instance (SONAR_HOST_URL repo variable).
sonar.projectKey=agentic-ids
sonar.projectName=Agentic IDS

sonar.sources=app.py,main.py,agents,utils
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,models/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

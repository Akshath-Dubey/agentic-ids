# SonarQube Cloud (sonarcloud.io) analysis settings, used by the CI workflow.
# Organization/project keys are the defaults SonarQube Cloud assigns when the
# GitHub repo is imported; change them if yours differ.
sonar.organization=akshath-dubey
sonar.projectKey=Akshath-Dubey_agentic-ids
sonar.projectName=Agentic IDS

sonar.sources=app.py,main.py,agents,utils
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,models/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

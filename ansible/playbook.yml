---
# Configures the single EC2 host as a K3s node and deploys Agentic IDS onto it.
#
#   Full setup + deploy:  ansible-playbook playbook.yml -e app_image=ghcr.io/<owner>/agentic-ids:<tag>
#   Server setup only:    ansible-playbook playbook.yml --tags setup
#   Deploy only (CI):     ansible-playbook playbook.yml --tags deploy -e app_image=... -e upgrade_packages=false
#
# Optional for private GHCR images: -e ghcr_username=<user> -e ghcr_token=<token>

- name: Configure K3s host and deploy Agentic IDS
  hosts: k3s
  become: true

  vars:
    upgrade_packages: true
    k3s_channel: stable
    swap_size: 2G
    app_namespace: agentic-ids
    manifest_dir: /opt/agentic-ids/k8s
    kubectl: /usr/local/bin/k3s kubectl
    manifests:
      - namespace.yaml
      - configmap.yaml
      - deployment.yaml
      - service.yaml
      - ingress.yaml

  tasks:
    # ---------------- Server setup ----------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [setup, deploy]

    - name: Upgrade installed packages (safe)
      ansible.builtin.apt:
        upgrade: safe
      when: upgrade_packages | bool
      tags: setup

    - name: Install system dependencies
      ansible.builtin.apt:
        name: [curl, ca-certificates, apt-transport-https]
        state: present
      tags: setup

    - name: Harden SSH (keys only, no root login)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh
      tags: setup

    # Small instances (t3.small = 2 GiB) need swap headroom for K3s + model training.
    - name: Create swapfile
      ansible.builtin.command: fallocate -l {{ swap_size }} /swapfile
      args:
        creates: /swapfile
      register: swapfile
      tags: setup

    - name: Format and enable swapfile
      ansible.builtin.shell: chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
      when: swapfile.changed
      changed_when: true
      tags: setup

    - name: Persist swapfile across reboots
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0
      tags: setup

    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"
      tags: setup

    - name: Install K3s (single-node server)
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 600 --kubelet-arg=fail-swap-on=false"
      args:
        creates: /usr/local/bin/k3s
      tags: setup

    - name: Ensure K3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
      tags: [setup, deploy]

    - name: Create kubeconfig directory for the SSH user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
      tags: setup

    - name: Give the SSH user kubectl access
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      tags: setup

    - name: Wait for the Kubernetes node to be Ready
      ansible.builtin.command: "{{ kubectl }} wait --for=condition=Ready node --all --timeout=180s"
      changed_when: false
      tags: [setup, deploy]

    - name: Wait for Traefik ingress controller
      ansible.builtin.command: "{{ kubectl }} -n kube-system rollout status deployment/traefik --timeout=300s"
      register: traefik
      retries: 10
      delay: 15
      until: traefik.rc == 0
      changed_when: false
      tags: [setup, deploy]

    - name: Show node status
      ansible.builtin.command: "{{ kubectl }} get nodes -o wide"
      register: nodes
      changed_when: false
      tags: [setup, deploy]

    - name: Node status
      ansible.builtin.debug:
        var: nodes.stdout_lines
      tags: [setup, deploy]

    # ---------------- Application deploy ----------------
    - name: Require app_image for deployment
      ansible.builtin.assert:
        that: app_image is defined and app_image | length > 0
        fail_msg: "Pass -e app_image=ghcr.io/<owner>/agentic-ids:<tag> (or run with --tags setup)."
      tags: deploy

    - name: Create manifest directory
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: directory
        mode: "0750"
      tags: deploy

    - name: Copy Kubernetes manifests
      ansible.builtin.copy:
        src: "../k8s/{{ item }}"
        dest: "{{ manifest_dir }}/{{ item }}"
        mode: "0640"
      loop: "{{ manifests }}"
      tags: deploy

    - name: Set application image
      ansible.builtin.replace:
        path: "{{ manifest_dir }}/deployment.yaml"
        regexp: 'image: APP_IMAGE.*$'
        replace: "image: {{ app_image }}"
      tags: deploy

    - name: Apply namespace
      ansible.builtin.command: "{{ kubectl }} apply -f {{ manifest_dir }}/namespace.yaml"
      register: ns
      changed_when: "'unchanged' not in ns.stdout"
      tags: deploy

    - name: Create/refresh GHCR image pull secret
      ansible.builtin.shell: |
        set -o pipefail
        {{ kubectl }} -n {{ app_namespace }} create secret docker-registry ghcr-pull \
          --docker-server=ghcr.io \
          --docker-username='{{ ghcr_username }}' \
          --docker-password='{{ ghcr_token }}' \
          --dry-run=client -o yaml | {{ kubectl }} apply -f -
      args:
        executable: /bin/bash
      when: ghcr_token is defined and ghcr_token | length > 0
      no_log: true
      changed_when: true
      tags: deploy

    - name: Apply application manifests
      ansible.builtin.command: "{{ kubectl }} apply -f {{ manifest_dir }}"
      register: apply
      changed_when: "'configured' in apply.stdout or 'created' in apply.stdout"
      tags: deploy

    - name: Wait for rollout to finish
      ansible.builtin.command: "{{ kubectl }} -n {{ app_namespace }} rollout status deployment/agentic-ids --timeout=600s"
      changed_when: false
      tags: deploy

    - name: Verify dashboard responds through the ingress
      ansible.builtin.uri:
        url: "http://{{ ansible_default_ipv4.address }}/_stcore/health"
        status_code: 200
        return_content: true
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      tags: deploy

    - name: Deployment result
      ansible.builtin.debug:
        msg: "Agentic IDS ({{ app_image }}) is live at http://{{ ansible_host | default(inventory_hostname) }}"
      tags: deploy

  handlers:
    - name: Restart ssh
      ansible.builtin.systemd:
        name: ssh
        state: restarted

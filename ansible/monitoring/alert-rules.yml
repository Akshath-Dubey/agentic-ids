groups:
  - name: agentic-ids
    rules:
      - alert: HighCPUUsage
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage on {{ $labels.instance }} is {{ printf \"%.1f\" $value }}% (above 80% for 5 minutes)."

      - alert: HighMemoryUsage
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "High memory on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} is {{ printf \"%.1f\" $value }}% (above 90% for 5 minutes)."

      - alert: DiskSpaceLow
        expr: 100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ printf \"%.1f\" $value }}% of / is free on {{ $labels.instance }}."

      - alert: InstanceDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is unreachable"
          description: "Prometheus cannot scrape node_exporter on {{ $labels.instance }} for 2 minutes."

      - alert: AppEndpointDown
        expr: probe_success{job="app"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Agentic IDS dashboard is down"
          description: "{{ $labels.url }} has failed health checks for 2 minutes."

      - alert: AppReplicasUnavailable
        expr: kube_deployment_status_replicas_available{namespace="agentic-ids"} < kube_deployment_spec_replicas{namespace="agentic-ids"}
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Agentic IDS has unavailable replicas"
          description: "Only {{ $value }} replica(s) of {{ $labels.deployment }} are available."

      - alert: PodRestartingOften
        expr: increase(kube_pod_container_status_restarts_total{namespace="agentic-ids"}[15m]) > 3
        labels: { severity: warning }
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting"
          description: "{{ $labels.pod }} restarted {{ printf \"%.0f\" $value }} times in 15 minutes."

# NOT applied automatically and never committed with real values.
# The app needs no secrets today. The only secret in use is the GHCR pull
# secret, which Ansible creates on every deploy from the CI token:
#
#   kubectl -n agentic-ids create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<github-user> \
#     --docker-password=<token-with-read:packages>
#
# If the app later needs secrets, add them like this and reference them with envFrom:
apiVersion: v1
kind: Secret
metadata:
  name: agentic-ids-secrets
  namespace: agentic-ids
type: Opaque
stringData:
  EXAMPLE_KEY: "change-me"

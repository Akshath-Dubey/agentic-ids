apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ids
  namespace: agentic-ids
  labels:
    app: agentic-ids
spec:
  replicas: 1 # Streamlit keeps session state in memory; one replica on a single node
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agentic-ids
  template:
    metadata:
      labels:
        app: agentic-ids
    spec:
      restartPolicy: Always
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentic-ids
          image: APP_IMAGE # replaced at deploy time with ghcr.io/<owner>/agentic-ids:<sha>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: agentic-ids-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1500m"
              memory: 1280Mi # sized for t3.small (2 GiB); raise on t3.medium
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6 # tolerate long training runs blocking the server briefly
